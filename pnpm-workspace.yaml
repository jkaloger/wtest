packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  msw: false

minimumReleaseAgeExclude:
  - "@supabase/auth-js@2.114.0"
  - "@supabase/functions-js@2.114.0"
  - "@supabase/postgrest-js@2.114.0"
  - "@supabase/realtime-js@2.114.0"
  - "@supabase/storage-js@2.114.0"
  - "@supabase/supabase-js@2.114.0"

# Exact, matching nixpkgs playwright-driver. Nothing transitive may float these: browsers come
# from the nix store and a version skew breaks executable path resolution. Enforced by AC8.
overrides:
  playwright: "1.61.1"
  "@playwright/test": "1.61.1"
